name: inventario
description: "App de Inventário."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_localizations:
    sdk: flutter

  # HTTP / API
  http: ^1.2.0

  # Persistência
  shared_preferences: ^2.2.2

  # Ícones vetoriais (logo do login)
  flutter_svg: ^2.0.9

  # WebView (fluxo Microsoft OAuth)
  webview_flutter: ^4.4.2
  mobile_scanner: ^7.4.2
  dio: ^5.11.1
  flutter_slidable: ^4.0.3
  path_provider: ^2.1.6
  pdf: ^3.12.0
  share_plus: ^13.3.1
  sqflite: ^2.4.2+1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/drawables/
    - assets/icons/
    - assets/overlays/

